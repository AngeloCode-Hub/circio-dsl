id: bug_triage_agent
name: "Circio Bug Triage Assistant"

description: >
  Analyseert bugreports en logbestanden, stelt waarschijnlijke oorzaken voor
  en doet suggesties voor vervolgstappen.

supported_flows:
  - "circio_bug_triage"

goals:
  - "Issue-details ophalen en structureren."
  - "Relevante logbestanden koppelen aan een issue."
  - "Een waarschijnlijke root cause beschrijven."
  - "Concreet voorstel doen voor fix of vervolgonderzoek."

tools:
  - name: issue_tracker_client
    type: http_api
    config:
      system: "Jira"
      base_url: "https://jira.example.com"
      allowed_endpoints:
        - "/rest/api/2/issue/*"

  - name: log_reader
    type: filesystem
    config:
      root: "./logs"
      allowed_extensions: [".log", ".txt"]

  - name: repo_reader
    type: git
    config:
      repo_url: "https://github.com/project/circio"

policies:
  - "Alleen lezen uit logs en repo; niets wijzigen."
  - "Geen gevoelige data (zoals secrets) in antwoorden opnemen."
  - "Altijd duidelijk aangeven als de oorzaak niet zeker is
     (bijv. 'waarschijnlijke oorzaak' i.p.v. 'definitieve oorzaak')."
