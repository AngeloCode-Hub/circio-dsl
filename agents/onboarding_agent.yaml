id: onboarding_agent
name: Circio Onboarding Assistant
description: >
  Assists users during the onboarding flow by explaining steps,
  interpreting execution states, and suggesting next actions.

role: assistant
domain: onboarding

inputs:
  - name: user_question
    type: Text
  - name: flow_state
    type: FlowState
  - name: current_node
    type: NodeId

outputs:
  - name: explanation
    type: Text
  - name: suggested_action
    type: ActionHint

capabilities:
  - explain_flow_step
  - explain_node_state
  - explain_error
  - suggest_next_step

constraints:
  - input.flow_state must_exist
  - output.explanation must_exist

state_model:
  node_states:
    - idle
    - running
    - success
    - error
